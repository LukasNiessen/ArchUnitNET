# SonarCloud Configuration for ArchUnitNET

sonar.projectKey=LukasNiessen_ArchUnitNET
sonar.projectName=ArchUnitNET
sonar.projectVersion=2.4.0
sonar.organization=lukasniessen

# Source directories
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/bin/**,**/obj/**,**/.vs/**,**/.vscode/**

# Code coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverage.exclusions=**/*.Tests.cs,**/test/**

# Test execution
sonar.test.inclusions=**/*.Tests.cs,**/test/**
sonar.test.exclusions=**/bin/**,**/obj/**

# Code analysis rules
sonar.pullrequest.github.repository=LukasNiessen/ArchUnitNET
sonar.pullrequest.github.summary_comment=true

# Rules settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Issue tracking
sonar.externalIssuesReportPaths=./report-issue-externalissuesjson.json

# Performance
sonar.sourceEncoding=UTF-8
sonar.scanAllFiles=true

# PR comment options
sonar.pullrequest.github.summary_comment_only=false
