name: Public Package Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore, compile, and execute public ArchUnit package
      run: >-
        dotnet run
        --project tests/ArchUnit.PackageSmoke/ArchUnit.PackageSmoke.csproj
        --configuration Release
