name: Release to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract version from tag
      id: tag_name
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore ArchUnitNET.sln

    - name: Build Release
      run: dotnet build ArchUnitNET.sln -c Release --no-restore

    - name: Run tests before release
      run: dotnet test ArchUnitNET.sln -c Release --no-build --logger "console;verbosity=minimal"

    - name: Create NuGet package
      run: >-
        dotnet pack src/ArchUnitNet/ArchUnitNet.csproj
        -c Release
        --no-build
        --output nupkg
        -p:PackageVersion=${{ steps.tag_name.outputs.VERSION }}

    - name: Log in to NuGet.org
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: lukasniessen

    - name: Publish to NuGet
      run: >-
        dotnet nuget push "nupkg/*.nupkg"
        --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: CHANGELOG.md
        files: nupkg/**/*.nupkg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install DocFX
      run: dotnet tool install -g docfx

    - name: Build documentation
      run: docfx docs/docfx.json

    - name: Publish documentation
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_site
